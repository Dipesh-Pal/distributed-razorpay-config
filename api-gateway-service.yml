server:
  port: 8080

app:
  security:
    public-routes:
      - "/api/v1/auth/signup"
      - "/api/v1/auth/login"
    jwt:
      public-key: ${JWT_PUBLIC_KEY}
      issuer: "razorpay-clone"
    cookie:
      path: /api/v1/auth                  # cookie only sent to auth endpoints (refresh, logout)
      same-site: Strict                   # blocks browser CSRF for cookie-bearing requests
      secure: ${COOKIE_SECURE:false}      # must be true in prod; override to false only for local http dev

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/api/v1/auth/**, /api/v1/merchants/**
                
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**, /api/v1/orders/**

            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/api/v1/vault/**
