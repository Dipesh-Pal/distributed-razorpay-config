server:
  port: 9040

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-vault-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

resilience4j:
  thread-pool-bulkhead:
    instances:
      vault-card-processor:
        max-thread-pool-size: 10
        core-thread-pool-size: 5
        queue-capacity: 20
        keep-alive-duration: 30s
        register-health-indicator: true

app:
  vault:
    master-key: ${PAYMENT_MASTER_KEY}
