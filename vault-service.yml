server:
  port: 9040

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-vault-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

app:
  vault:
    master-key: ${PAYMENT_MASTER_KEY}