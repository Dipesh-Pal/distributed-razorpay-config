server:
  port: 9030

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-operations-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

app:
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
      signature-header: "X-Razorpay-Signature"
      visibility-timeout: PT2M
    inbox:
      retention-days: 30
      cleanup-cron: "0 0 3 * * *"