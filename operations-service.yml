server:
  port: 9030

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-operations-db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connect-timeout: 2000
            read-timeout: 3000
          vault-service:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 15s
        failure-rate-threshold: 50
      vault-service:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 15s
        failure-rate-threshold: 50
  retry:
    instances:
      merchant-service:
        max-attempts: 2
        wait-duration: 500ms
      vault-service:
        max-attempts: 2
        wait-duration: 500ms

app:
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
      signature-header: "X-Razorpay-Signature"
      visibility-timeout: PT2M
    inbox:
      retention-days: 30
      cleanup-cron: "0 0 3 * * *"
